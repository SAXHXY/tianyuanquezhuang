<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>甜原雀庄 · 雀神争霸赛</title>
<script>
const DATA = {
  clubName: '甜原雀庄',
  league: '雀神争霸赛',
  subtitle: '2023-2026 全赛季',
  slogan: '以牌会友 · 雀鸣甜原',
  desc: '甜原雀庄，一个以麻将结缘的小圈子。从2023到2026，四年雀神争霸，有欢笑有遗憾，有连庄有翻盘。',
  bgm: 'bgm.mp3',
  bgmName: '大提琴 · 沉思曲',
  photos: ['雀庄合影_1.jpg'],
  members: [
    {name:'王筱甜', v:[2662,3190,3683,-94],  tag:'🏆 四冠王'},
    {name:'博哥',   v:[1537,1153,1869,167],  tag:'🥈 铁打亚军'},
    {name:'老航',   v:[780,982,200,344],     tag:'🥉 稳定输出'},
    {name:'雪原',   v:[-76,629,1284,-18],    tag:'🎲 2025最佳进步'},
    {name:'基佬',   v:[-53,309,0,0],         tag:''},
    {name:'二门',   v:[-74,-354,0,0],        tag:'2026休赛'},
    {name:'意林',   v:[-509,147,-437,0],     tag:''},
    {name:'小程',   v:[0,-1763,-112,371],    tag:'2026翻红 +371'},
    {name:'奇',     v:[0,-1949,142,-46],     tag:''},
    {name:'纯柏',   v:[-507,-801,-456,-92],  tag:''},
    {name:'朱大哥', v:[-1815,-159,-559,253], tag:'2026回归 +253'},
    {name:'小姜',   v:[-475,-759,-1614,0],   tag:'2026休赛'},
    {name:'子书',   v:[-267,-1475,-1025,-252],tag:''},
    {name:'司老师', v:[-1203,-1186,-2200,-605],tag:''},
  ],
  champions: {2023:'王筱甜',2024:'王筱甜',2025:'王筱甜',2026:'小程'},
  highlights: {
    2023:'首届雀神争霸赛，王筱甜以2662分碾压开局，奠定四冠传奇序幕。',
    2024:'竞争白热化，王筱甜3190分卫冕成功，博哥1153稳居次席。',
    2025:'王筱甜3683分三连冠，雪原爆发+1284当选赛季最佳进步！',
    2026:'旧王休整新王崛起——小程翻红+371登顶，朱大哥回归+253惊艳全场。'
  }
};
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e8dcc8;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}
/* 背景装饰 */
body::before{content:'🀄';position:fixed;font-size:30vw;opacity:.03;top:-5%;right:-10%;transform:rotate(15deg);pointer-events:none;z-index:0}
body::after{content:'🀄';position:fixed;font-size:20vw;opacity:.03;bottom:-5%;left:-10%;transform:rotate(-20deg);pointer-events:none;z-index:0}
/* 顶部音乐条 */
.music-bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;background:rgba(10,10,10,.95);backdrop-filter:blur(8px);border-bottom:1px solid #222}
.music-bar .info{font-size:.8rem;color:#a09078;display:flex;align-items:center;gap:.5rem}
.music-bar .btn{width:32px;height:32px;border-radius:50%;border:1px solid #d4a853;background:transparent;color:#d4a853;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.music-bar .btn:hover{background:rgba(212,168,83,.15)}
/* 主容器 */
main{position:relative;z-index:1}
/* 各section */
section{padding:2rem 1rem;border-bottom:1px solid #1a1a1a;position:relative}
section::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,#333,transparent)}
/* Hero */
.hero{text-align:center;padding:3rem 1rem 2rem;background:radial-gradient(ellipse at 50% 0%,rgba(212,168,83,.08),transparent 70%)}
.hero h1{font-size:2rem;background:linear-gradient(135deg,#d4a853,#f0d080,#d4a853);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px}
.hero .sub{color:#7a6a58;font-size:.85rem;margin-top:.3rem}
.hero .slogan{display:inline-block;margin-top:.6rem;padding:.2rem 1rem;border:1px solid rgba(212,168,83,.3);border-radius:20px;color:#d4a853;font-size:.75rem;letter-spacing:2px}
.hero .desc{color:#8a7a68;font-size:.82rem;margin-top:.8rem;line-height:1.6;max-width:400px;margin-left:auto;margin-right:auto}
/* 麻将装饰线 */
.tile-line{display:flex;justify-content:center;gap:.3rem;margin:.6rem 0;opacity:.15;flex-wrap:wrap}
.tile-line span{font-size:1.4rem}
/* 合影 */
.photo-section{padding:1.5rem 1rem}
.photo-grid{display:flex;overflow-x:auto;gap:.6rem;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:.5rem}
.photo-grid img{height:200px;border-radius:10px;scroll-snap-align:start;flex-shrink:0;border:1px solid #2a2a2a;transition:.3s}
.photo-grid img:hover{transform:scale(1.02);border-color:#d4a853}
.photo-section .label{text-align:center;font-size:.7rem;color:#5a5a5a;margin-top:.4rem}
/* 成员区 */
.member-section{padding:1.5rem 1rem}
.section-title{color:#d4a853;font-size:.95rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
.section-title .line{flex:1;height:1px;background:linear-gradient(90deg,#d4a853,transparent)}
.member-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.member-card{background:linear-gradient(135deg,#141414,#1a1a1a);border-radius:10px;padding:.7rem;border:1px solid #222;transition:.3s}
.member-card:hover{border-color:#d4a853;transform:translateY(-2px)}
.member-card .rank{color:#5a5a5a;font-size:.65rem}
.member-card .name{font-size:1rem;font-weight:600;color:#f0e8d8}
.member-card .score{font-size:1.2rem;font-weight:700}
.member-card .tag{font-size:.65rem;color:#7a6a58;margin-top:.1rem}
.member-card .breakdown{font-size:.6rem;color:#4a4a4a;margin-top:.2rem;display:flex;gap:.4rem;flex-wrap:wrap}
.positive{color:#4ecb71}
.negative{color:#e85454}
.zero{color:#5a5a5a}
/* 排行榜 */
.board-section{padding:1.5rem 1rem}
.score-table{width:100%;border-collapse:collapse;font-size:.78rem}
.score-table th{background:#141414;color:#d4a853;padding:.4rem .3rem;text-align:center;font-weight:500}
.score-table td{text-align:center;padding:.35rem .2rem;border-bottom:1px solid #1a1a1a}
.score-table tr{transition:.2s}
.score-table tr:hover{background:rgba(212,168,83,.05)}
.score-table .pos{color:#5a5a5a;font-size:.65rem}
.pos-num{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;font-size:.6rem;text-align:center}
.pos-1{background:linear-gradient(135deg,#d4a853,#b8922e);color:#000}
.pos-2{background:linear-gradient(135deg,#c0c0c0,#909090);color:#000}
.pos-3{background:linear-gradient(135deg,#cd7f32,#a06020);color:#fff}
/* 赛季 */
.season-section{padding:1.5rem 1rem}
.season-grid{display:grid;gap:.5rem}
.season-card{background:linear-gradient(135deg,#141414,#1a1a1a);border-radius:10px;padding:.8rem;border:1px solid #222;border-left:3px solid;transition:.3s}
.season-card:hover{border-color:#d4a853}
.season-card .year{font-size:1rem;font-weight:600;color:#f0e8d8}
.season-card .champ{font-size:.78rem;color:#d4a853;margin-top:.15rem}
.season-card .detail{font-size:.75rem;color:#7a6a58;margin-top:.3rem;line-height:1.5}
/* 页脚 */
footer{text-align:center;padding:2rem 1rem;color:#3a3a3a;font-size:.7rem;position:relative;z-index:1}
footer .tiles{font-size:1.5rem;margin-bottom:.5rem;opacity:.3}
/* 回到顶部 */
.top-btn{position:fixed;bottom:1.5rem;right:1.5rem;width:40px;height:40px;border-radius:50%;background:rgba(212,168,83,.12);border:1px solid rgba(212,168,83,.3);color:#d4a853;font-size:1.2rem;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:99;backdrop-filter:blur(4px);transition:.3s}
.top-btn:hover{background:rgba(212,168,83,.25)}
.top-btn.show{display:flex}
</style>
</head>
<body>

<div class="music-bar">
  <div class="info"><span id="musicIcon">🎵</span><span id="musicName">正在加载...</span></div>
  <button class="btn" id="musicBtn">▶</button>
</div>

<main>
  <!-- HERO -->
  <section class="hero">
    <div class="tile-line"><span>🀄</span><span>🀄</span><span>🀄</span><span>🀄</span><span>🀄</span></div>
    <h1>🀄 甜原雀庄</h1>
    <div class="sub">雀神争霸赛 · 2023 - 2026</div>
    <div class="slogan">以牌会友 · 雀鸣甜原</div>
    <p class="desc">甜原雀庄，一个以麻将结缘的小圈子。从2023到2026，四年雀神争霸，有欢笑有遗憾，有连庄有翻盘。</p>
    <div class="tile-line"><span>🀇</span><span>🀈</span><span>🀉</span><span>🀊</span><span>🀋</span></div>
  </section>

  <!-- 合影 -->
  <section class="photo-section">
    <div class="section-title"><span>📸</span> 雀庄合影 <span class="line"></span></div>
    <div class="photo-grid" id="photoGrid"></div>
    <div class="label">▼ 左右滑动查看更多 ▼</div>
  </section>

  <!-- 成员 -->
  <section class="member-section">
    <div class="section-title"><span>👥</span> 全员 · 14人 <span class="line"></span></div>
    <div class="member-grid" id="memberGrid"></div>
  </section>

  <!-- 排行榜 -->
  <section class="board-section">
    <div class="section-title"><span>🏆</span> 总战绩榜 <span class="line"></span></div>
    <div style="overflow-x:auto"><table class="score-table" id="boardTable"></table></div>
  </section>

  <!-- 赛季 -->
  <section class="season-section">
    <div class="section-title"><span>📊</span> 赛季回顾 <span class="line"></span></div>
    <div class="season-grid" id="seasonGrid"></div>
  </section>
</main>

<footer>
  <div class="tiles">🀄 🀄 🀄</div>
  甜原雀庄 · 以牌会友 · 雀鸣甜原<br>
  2023-2026 赛季全记录
</footer>

<button class="top-btn" id="topBtn">↑</button>

<script>
const YRS = ['2023','2024','2025','2026'];
const C_COLORS = ['#e85454','#e07848','#d4a853','#4ecb71'];

// 合照
const pg = document.getElementById('photoGrid');
['雀庄合影_1.jpg'].forEach(p=>{
  const img = document.createElement('img');
  img.src = p; img.alt = '雀庄合影';
  img.onerror = function(){ this.remove(); };
  pg.appendChild(img);
});

// 成员卡片（按总战绩排序）
const members = [...DATA.members].sort((a,b)=>{
  return b.v.reduce((s,x)=>s+x,0) - a.v.reduce((s,x)=>s+x,0);
});
const mg = document.getElementById('memberGrid');
members.forEach((m,i)=>{
  const total = m.v.reduce((s,x)=>s+x,0);
  const cls = total>0?'positive':(total<0?'negative':'zero');
  mg.innerHTML += `<div class="member-card">
    <div class="rank">#${i+1}</div>
    <div class="name">${m.name}</div>
    <div class="score ${cls}">${total>0?'+':''}${total}</div>
    <div class="tag">${m.tag||'&nbsp;'}</div>
    <div class="breakdown">${YRS.map((y,j)=>`${y} ${m.v[j]>0?'+':''}${m.v[j]}`).join(' · ')}</div>
  </div>`;
});

// 总榜
const tbl = document.getElementById('boardTable');
let html = '<tr><th>#</th><th>选手</th>'+YRS.map(y=>`<th>${y}</th>`).join('')+'<th>总计</th></tr>';
members.forEach((m,i)=>{
  const total = m.v.reduce((s,x)=>s+x,0);
  const cls = total>0?'positive':(total<0?'negative':'zero');
  const badge = i===0?'pos-1':(i===1?'pos-2':(i===2?'pos-3':''));
  html += `<tr><td class="pos"><span class="pos-num ${badge}">${i+1}</span></td>
    <td style="text-align:left;padding-left:.5rem">${m.name}</td>`;
  m.v.forEach(s=>{
    const sc = s>0?'positive':(s<0?'negative':'zero');
    html += `<td class="${sc}">${s>0?'+':''}${s}</td>`;
  });
  html += `<td class="${cls}" style="font-weight:700">${total>0?'+':''}${total}</td></tr>`;
});
tbl.innerHTML = html;

// 赛季回顾
const sg = document.getElementById('seasonGrid');
YRS.forEach((y,i)=>{
  sg.innerHTML += `<div class="season-card" style="border-left-color:${C_COLORS[i]}">
    <div class="year">${y} 赛季</div>
    <div class="champ">🏆 冠军 · ${DATA.champions[y]||'—'}</div>
    <div class="detail">${DATA.highlights[y]||''}</div>
  </div>`;
});

// ---- 音乐播放器 ----
(function(){
  const audio = new Audio(DATA.bgm);
  audio.loop = true;
  const btn = document.getElementById('musicBtn');
  const nameEl = document.getElementById('musicName');
  nameEl.textContent = '🎵 ' + (DATA.bgmName||'背景音乐');
  let playing = false;
  btn.onclick = function(){
    playing ? (audio.pause(), btn.textContent='▶') : (audio.play().then(()=>btn.textContent='⏸').catch(()=>{}));
    playing = !playing;
  };
  document.addEventListener('click',()=>{ if(!playing){ audio.play().then(()=>{ playing=true; btn.textContent='⏸'; }).catch(()=>{}); } },{once:true});
  setTimeout(()=>{ if(!playing){ audio.play().then(()=>{ playing=true; btn.textContent='⏸'; }).catch(()=>{}); } },1000);
})();

// 回到顶部
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll',()=>{ topBtn.classList.toggle('show',window.scrollY>400); });
topBtn.onclick = ()=>{ window.scrollTo({top:0,behavior:'smooth'}); };
</script>
</body>
</html>
